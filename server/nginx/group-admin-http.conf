# 群体服务版：部署方后台（/__admin）的 nginx HTTP 反代示例。
# 适用于「后台只绑回环、通过 nginx 加 basic auth / IP 白名单」的部署。
#
# 前置：server/docker-compose.group.yml 的 admin 端口默认发布到 127.0.0.1:19444
#       （容器内 relay 后台监听 9444，证书是 relay 域名证书）。
# 用法：把本文件放进 nginx 的 http{}（例如 conf.d/），改域名/证书路径/.htpasswd。
# 注意：如果 443 已被 stream 占用（group edge / classic relay），这个 vhost 要么放在
#       另一个端口（下例 9443），要么在 stream 里给 admin 域名单独分流到另一个 http listen。

server {
    listen 9443 ssl;
    http2 on;
    server_name admin.relay.example.com;      # ← 改成你的后台域名（DNS 指向本机）

    ssl_certificate     /etc/nginx/certs/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin/privkey.pem;

    # 额外加固：basic auth + 只允许可信来源（按需保留/修改）
    auth_basic           "DSH group admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    # allow 203.0.113.10;   # ← 你的办公/家庭出口 IP
    # deny  all;

    location /__admin/ {
        # relay 后台是 HTTPS（复用 relay 域名证书），nginx 作为客户端回连回环端口
        proxy_pass https://127.0.0.1:19444;
        proxy_ssl_verify off;                 # 仅回环，可接受；也可配 proxy_ssl_trusted_certificate
        proxy_ssl_server_name on;
        proxy_ssl_name relay.example.com;     # ← relay 域名（控制面证书 CN/SAN）

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
