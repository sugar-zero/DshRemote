# 宿主机已有 nginx 时使用：把这张文件 include 到 nginx.conf 的 main 上下文
#   include /etc/nginx/dsh-relay-stream.conf;
#
# 前置：relay 容器通过 server/docker-compose.yml 绑定到：
#   RELAY_DATA_PORT_HOST（默认 1443）  → relay 的 443（数据面 TLS 透传）
#   RELAY_CONTROL_PORT_HOST（默认 18443）→ relay 的 8443（控制面 WSS）
#
# 这张文件只做 L4 TCP/SNI 透传，不解密。relay 域名和 *.relay 域名不要
# 在 nginx 的 http{} 里做 HTTPS server/反向代理。

stream {
    map $ssl_preread_server_name $dsh_backend {
        relay.example.com                relay_tls;   # ← 改成你的 relay 域名
        ~^.+\.relay\.example\.com$       relay_tls;   # ← 主机子域 <hostId>.<domain>
        default                          web_tls;     # 其它域名交给现有 nginx HTTPS
    }

    upstream relay_tls {
        server 127.0.0.1:1443;   # RELAY_DATA_PORT_HOST
    }

    upstream web_tls {
        server 127.0.0.1:4433;   # 现有 nginx HTTPS server 的内部监听端口
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $dsh_backend;
        proxy_timeout 1h;
        proxy_buffer_size 16k;
    }

    # 控制面 WSS：纯 TCP 透传
    server {
        listen 8443;
        proxy_pass 127.0.0.1:18443;   # RELAY_CONTROL_PORT_HOST
        proxy_timeout 1h;
    }
}
