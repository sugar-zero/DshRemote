# 群体服务版：注册 API（/__group/register）的 nginx HTTP 反代示例（可选）。
#
# 说明：注册 API 不依赖 SNI/多域名路由，只有一个 POST /__group/register；
#   - 也可以用 L4（stream）直接转发，最简单；
#   - 若想用 nginx 统一入口/加 basic auth/IP 白名单，可用本文件让 nginx 终止 TLS，
#     再作为 TLS 客户端反代到 relay 的 API 端口。
#
# 前置：
#   - relay compose 里 RELAY_GROUP_API_HOST_BIND 设为 127.0.0.1（只让 nginx 访问）；
#   - RELAY_GROUP_API_HOST_PORT 默认 19443（relay 侧 HTTPS）；
#   - 主机插件「服务地址」填 nginx 暴露的地址，如 https://api.relay.example.com:9443
#     （主机收到注册响应里的 controlUrl 后会自动切到 WSS 控制面端口）。
#
# ⚠️ 注意：
#   1) 把 Host 覆盖成 relay 主域名（注册响应 controlUrl 用请求 Host 生成）；
#   2) relay 注册限速按 TCP 来源 IP 统计，反代后所有请求都是 127.0.0.1，
#      单 IP 限速会退化成共享桶——可调大 relay 的 registration.maxAttemptsPerMinute。
server {
    listen 9443 ssl;                       # 选一个未被 stream 占用的公网端口
    http2 on;
    server_name api.relay.example.com;     # ← 后台/edge 之外单独给 API 的域名（证书需覆盖）

    ssl_certificate     /etc/nginx/certs/api/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api/privkey.pem;

    # 可选加固
    # allow 203.0.113.10;
    # deny  all;

    location = /__group/register {
        proxy_pass https://127.0.0.1:19443;   # = RELAY_GROUP_API_HOST_PORT（relay API 监听）
        proxy_ssl_verify off;                 # 仅回环，可接受
        proxy_ssl_server_name on;
        proxy_ssl_name relay.example.com;     # ← RELAY_DOMAIN（relay API 证书名）

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host relay.example.com;   # 必须：保持 relay 主域名
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    location / {
        return 404;
    }
}
