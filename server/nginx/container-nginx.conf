# 专用服务器模式：nginx 容器同时承担 443/8443 的 TCP 透传和 80 的 healthz/跳转。
# 这个 nginx **不终止** relay 域名的 TLS；证书由 relay / 主机插件各自持有。
#
# 如果你的服务器已经有宿主机 nginx，请改用 host-nginx-stream.conf，
# 并只启动 relay：docker compose up -d relay

worker_processes auto;
events {
    worker_connections 1024;
}

stream {
    # SNI 只用于选路，不改写/不解密 TLS 字节
    map $ssl_preread_server_name $relay_backend {
        relay.example.com                relay_tls;   # ← 改成你的 relay 域名
        ~^.+\.relay\.example\.com$       relay_tls;   # ← 主机子域 <hostId>.<domain>
        default                          relay_tls;   # 专用服务器没有其它 HTTPS 站点；未知 SNI 交给 relay 拒绝
    }

    upstream relay_tls {
        server relay:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $relay_backend;
        proxy_timeout 1h;
        proxy_buffer_size 16k;
    }

    # 8443：relay 控制面 WSS，纯 TCP 透传，TLS 由 relay 终止
    server {
        listen 8443;
        proxy_pass relay:8443;
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        location = /healthz {
            proxy_pass http://relay:80/healthz;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
