# 官方推送 hub：nginx 终止 TLS + HTTP 反代示例（push-hub 0.3.0 = R2-only）。
#
# 拓扑：
#   官方 App（R2 设备登记） ──HTTPS(443, push.example.com)──► nginx ──HTTP──► 127.0.0.1:19445
#   主机 host-plugin（R2 直连）──HTTPS──► 同上 /v1/push（Bearer device credential）
##
# 前置：
#   1) server/docker-compose.push-hub.yml 已把 hub 发布到宿主 127.0.0.1:19445
#      （容器内 hub 只跑 HTTP；TLS 由本 nginx 终止，不要把 19445 暴露到公网）；
#   2) 域名 DNS 指向本机，证书已签发（占位路径 /etc/nginx/certs/push-hub/{fullchain,privkey}.pem）；
#      域名必须与 hub 的 HUB_PUBLIC_URL 一致（它是 credential 的 aud）；
#   3) 把本文件放进 nginx 的 http{}（例如 /etc/nginx/conf.d/），改域名/证书路径/端口后 reload。
#
# 暴露的路径（其余一律 404）：
#   POST /v1/push              R2 主机直连推送（Bearer device credential）
#   POST /v1/enroll/challenge  R2：官方 App 申请一次性 challenge
#   POST /v1/enroll            R2：官方 App 登记换 device credential
#   GET  /healthz              仅本机/监控（不要对公网开放）
#
# 安全要点：
#   - Authorization: Bearer <deviceCredential> 原样透传（hub 只认它，
#     不信任来源 IP/自定义头；这里转发 X-Forwarded-* 仅供日志排查）；
#   - client_max_body_size 20k（hub 侧另有 16KB 硬上限，二次兜底）；
#   - nginx 的 limit_req 是真正的 per-client-IP 粗限速（第一层便宜防御）：
#     hub 在 nginx 后面时看到的来源 IP 都是回环，hub 侧 per-IP 配额会退化成共享桶，
#     所以 enroll/push 的 IP 级限速主要靠这里兜底；
#   - hub 侧还有 per-device / per-credential / per-host / 全局配额（429 + Retry-After）。

# 限速兜底（必须写在 http{} 上下文；conf.d/*.conf 默认就是 http 上下文）。
# 阈值按预期用户量调整；正式配额看 hub 的 429 rate_limited。
#   push：设备直连是每设备每分钟个位数 + 每 host 30/分钟，20r/s 只防突发洪水；
#   enroll：正常一台设备 7 天才登记一次，收紧到 30r/m 足够。
limit_req_zone $binary_remote_addr zone=push_hub_push_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=push_hub_enroll_limit:10m rate=30r/m;

# HTTP → HTTPS 跳转（如 80 端口另有用途可删掉这段）。
server {
    listen 80;
    server_name push.example.com;      # ← 改成你的 hub 域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name push.example.com;      # ← 改成你的 hub 域名（DNS 指向本机；= HUB_PUBLIC_URL 的 host）

    ssl_certificate     /etc/nginx/certs/push-hub/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/push-hub/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:push_hub_ssl:10m;
    ssl_session_timeout 1h;
    # 可选 HSTS（确认全站 https 后开启）：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # hub 请求体上限 16KB；留一点余量（只收 kind/host/token(s) / enroll 字段）。
    client_max_body_size 20k;

    # 推送入口：R2 主机直连（Bearer device credential）打这里。
    location = /v1/push {
        # 只允许 POST；其它方法直接 403（hub 自己也会回 405）。
        limit_except POST {
            deny all;
        }
        limit_req zone=push_hub_push_limit burst=100 nodelay;

        proxy_pass http://127.0.0.1:19445;   # ← 与 compose 的 HUB_HOST_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 注意：Hub 只用 Authorization 鉴权，X-Forwarded-* 不参与身份判定。
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;              # APNs 单批最多 15s（hub 内部超时）
    }

    # R2：官方 App 设备登记（challenge + 提交 PoP 签名换 credential）。
    location = /v1/enroll/challenge {
        limit_except POST {
            deny all;
        }
        limit_req zone=push_hub_enroll_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:19445;   # ← 与 compose 的 HUB_HOST_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;              # 纯内存操作，不需要长等待
    }

    location = /v1/enroll {
        limit_except POST {
            deny all;
        }
        limit_req zone=push_hub_enroll_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:19445;   # ← 与 compose 的 HUB_HOST_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 健康检查：只允许本机与监控来源，不要对公网开放（会泄漏 topic 与能力开关）。
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        # allow 203.0.113.10;                # ← 换成你的监控/跳板机 IP（TEST-NET-3 示例）
        deny all;

        proxy_pass http://127.0.0.1:19445;   # ← 与 compose 的 HUB_HOST_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # 其余一律不暴露。
    location / {
        return 404;
    }
}
