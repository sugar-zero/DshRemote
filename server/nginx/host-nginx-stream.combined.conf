# 同一台宿主机同时承载 classic（盲中继）与 group（A 模式，relay 终止手机 TLS）时的
# **合并版** nginx stream 配置。
#
# 为什么必须合并：nginx 只能有一份 stream{}；443/8443 每个端口只能 listen 一次。
#   ❌ 同时 include host-nginx-stream.conf 和 group-nginx-stream.conf → listen 冲突（nginx -t 报错）
#   ✅ 用本文件一份搞定，按 SNI 分流（TLS 仍由各自 relay 终止，nginx 不解密）
#
# 把它 include 到 nginx.conf 的 **main 上下文**（与 http{} 同级）：
#   include /etc/nginx/dsh-stream-combined.conf;
#
# 端口分配（宿主机）：
#   classic relay：数据面 127.0.0.1:1443、控制面 127.0.0.1:18443
#   group   relay：边缘   127.0.0.1:16443、控制面 127.0.0.1:18444   ← 不能和 classic 用同一宿主端口
#   （group compose 里把 RELAY_GROUP_EDGE_HOST_PORT / RELAY_GROUP_CONTROL_HOST_PORT 设成 16443/18444，
#     并把两个 BIND 设为 127.0.0.1；手机实际访问端口仍由 relay.json 的 mobilePort 决定）
#
# 域名要求：classic 与 group 使用**不同的 relay 域名**（group 还需要自己的通配证书）。

stream {
    # 443（手机访问）：按 SNI 分流；TLS 字节原样转发，由各自 relay 终止
    map $ssl_preread_server_name $dsh443 {
        ~^.+\..+\.example\.com$   dsh_group_edge;      # ← group：<hostId>.<groupRelayDomain>，改成你的匹配
        relay.example.com           dsh_classic_relay;  # ← classic relay 域名
        ~^.+\..+\.example\.com$   dsh_classic_relay;  # ← classic 主机子域（如 ~^.+\.relay\.example\.com$）
        default                     web_tls;            # 其它域名交给现有 nginx HTTPS
    }

    # 8443（主机控制面 WSS）：WSS 的 ClientHello 也带 SNI，同样可按域名区分
    map $ssl_preread_server_name $dsh8443 {
        group-relay.example.com     dsh_group_control;  # ← group relay 域名
        default                     dsh_classic_control;
    }

    upstream dsh_classic_relay   { server 127.0.0.1:1443;  }  # classic RELAY_DATA_PORT_HOST
    upstream dsh_classic_control { server 127.0.0.1:18443; }  # classic RELAY_CONTROL_PORT_HOST
    upstream dsh_group_edge      { server 127.0.0.1:16443; }  # group RELAY_GROUP_EDGE_HOST_PORT
    upstream dsh_group_control   { server 127.0.0.1:18444; }  # group RELAY_GROUP_CONTROL_HOST_PORT
    upstream web_tls             { server 127.0.0.1:4433;  }  # 现有 nginx HTTPS 内部监听端口

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $dsh443;
        proxy_timeout 1h;
        proxy_buffer_size 16k;
    }

    server {
        listen 8443;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_pass $dsh8443;
        proxy_timeout 1h;
        proxy_buffer_size 16k;
    }
}
