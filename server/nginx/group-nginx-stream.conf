# 宿主机已有 nginx、且 443/8443 已被 nginx 占用时使用（群体服务版 group 模式）。
# ⚠️ 本文件用于**只部署 group 的独立服务器**（listen 443/8443）。
#    如果同机还有 classic 的 host-nginx-stream.conf：不能两份都 include（listen 端口冲突），
#    请改用 host-nginx-stream.combined.conf 合并版。
#
# 重要：本文件 listen 的端口（下面 443）就是**手机实际访问端口**，必须与
#   RELAY_GROUP_MOBILE_PORT / relay.json 的 group.mobilePort 一致（通常 443）。
#   容器宿主映射端口（默认 1443）只在内网给 nginx 转发用，不能写进 mobilePort。
#
# 把它 include 到 nginx.conf 的 **main 上下文**（与 http{} 同级）：
#   include /etc/nginx/dsh-group-stream.conf;
#
# 与 classic 的 host-nginx-stream.conf 的区别：
#   - group 模式下 **relay 自己终止手机 TLS**（边缘通配证书），nginx 只做 L4 TCP 转发，不解密；
#   - 因此这里不需要给 relay 配证书，也不要在 http{} 里为 relay 域名做 HTTPS server/反代。
#   - 需要占用 443 的话用 ssl_preread 只按 SNI 分流（仍不解密），其它域名继续走现有 nginx HTTPS。
#
# 前置：server/docker-compose.group.yml 把容器端口映射到：
#   RELAY_GROUP_EDGE_HOST_PORT（默认 1443）   → relay 边缘 TLS（手机访问）
#   RELAY_GROUP_CONTROL_HOST_PORT（默认 18443）→ relay 控制面（主机隧道 + 注册 + /__admin）
# 并把 RELAY_GROUP_EDGE_BIND / RELAY_GROUP_CONTROL_BIND 设为 127.0.0.1（只让 nginx 访问容器）。

stream {
    map $ssl_preread_server_name $dsh_group_backend {
        ~^.+\..+\.example\.com$   dsh_group_edge;   # ← 改成你的 <hostId>.<relayDomain> 匹配（如 ~^.+\.relay\.example\.com$）
        default                     web_tls;          # 其它域名交给现有 nginx HTTPS（如需）
    }

    upstream dsh_group_edge {
        server 127.0.0.1:1443;   # RELAY_GROUP_EDGE_HOST_PORT
    }

    upstream dsh_group_control {
        server 127.0.0.1:18443;  # RELAY_GROUP_CONTROL_HOST_PORT
    }

    upstream web_tls {
        server 127.0.0.1:4433;   # 现有 nginx HTTPS server 的内部监听端口（按需修改）
    }

    # 手机访问：按 SNI 分流到 relay 边缘（不终止 TLS）；没有共用 443 需求时可直接 proxy_pass dsh_group_edge
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $dsh_group_backend;
        proxy_timeout 1h;
        proxy_buffer_size 16k;
    }

    # 控制面：纯 TCP 转发（WSS），主机插件从这里连 relay
    server {
        listen 8443;
        proxy_pass dsh_group_control;
        proxy_timeout 1h;
    }
}
