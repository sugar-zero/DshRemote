# ============================================================================
# 群体服务版（A 模式）relay 部署模板
#
# 与 docker-compose.build.yml（classic 盲中继）的区别：
#   - relay 终止手机 TLS（边缘通配证书），主机只做出站隧道、自助注册；
#   - 控制面同时提供：主机隧道、自助注册（邀请码）、部署方后台 /__admin；
#   - 不使用 RELAY_HOST_ID / tokens.json（主机由邀请码自助注册）。
#
# 准备（只需 .env + 证书，配置文件首次启动自动生成）：
#   cp .env.group.example .env.group   # 至少改 RELAY_DOMAIN
#   mkdir -p data/certs
#   # 控制面证书：data/certs/<RELAY_DOMAIN>/{fullchain.pem,privkey.pem}
#   # 边缘通配证书：data/certs/wildcard/{fullchain.pem,privkey.pem}
#   chown -R 100:101 data
#   # 首次启动会据此生成 data/config/relay.json（已存在则不会覆盖；
#   # 需要高级项可手改该文件，模板见 server/group/relay.group.example.json）
#
# 环境变量模板：cp .env.group.example .env.group（按部署修改端口/镜像/日志）
#
# 端口只有两类：★公网入口（放行/nginx 转发）与本机内部端口。
#   直连（无 nginx）：host 侧 1443(edge)/18443(WSS)/19443(API) 直接对公网，后台 19444 只绑回环。
#   nginx 前置：nginx listen 443/8443 L4 转发到 127.0.0.1:1443/18443，API 仍走 19443；
#   此时把 RELAY_GROUP_EDGE_BIND / RELAY_GROUP_CONTROL_BIND 设为 127.0.0.1。
#
# 构建 + 启动：
#   docker compose --env-file .env.group -f docker-compose.group.yml up -d --build
#   # 本机 Apple Silicon、服务器 x86_64：
#   DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose --env-file .env.group -f docker-compose.group.yml up -d --build
#
# 职责分离（四个面）：
#   edge  : 手机访问（默认宿主 1443 → 容器 443，relay 自己终止 TLS）
#   WSS   : 主机隧道（默认宿主 18443 → 容器 8443，只做 WebSocket upgrade）
#   API   : 主机自助注册（默认宿主 19443 → 容器 9443；主机插件「服务地址」填它）
#   admin : 部署方后台（默认宿主 127.0.0.1:19444 → 容器 9444；nginx/SSH 隧道访问）
#
# 后台：https://<relayDomain>:19444/__admin/（或经 nginx 反代到 admin 域名）
#   admin token：首次启动自动生成到 data/admin-token（0600）；也可设 RELAY_ADMIN_TOKEN。
#   查看：docker exec dsh-relay-group node packages/relay/bin/relay.js admin-token --config /data/config/relay.json
#
# 导出离线镜像：
#   docker save -o dsh-relay-0.2.13-group-linux-amd64.tar dsh-remote-relay:0.2.13-group
# ============================================================================

name: dsh-remote-group

services:
  relay:
    build:
      context: ../dsh-remoteService
      dockerfile: packages/relay/Dockerfile
    image: ${DSH_RELAY_IMAGE:-dsh-remote-relay:0.2.13-group}
    container_name: dsh-relay-group
    user: "${RELAY_UID:-100}:${RELAY_GID:-101}"
    command: ["node", "packages/relay/bin/relay.js", "--config", "/data/config/relay.json"]
    restart: unless-stopped
    ports:
      # ★ 手机访问（relay 边缘终止 TLS）：直连默认对公网；nginx 前置时 BIND 改 127.0.0.1
      - "${RELAY_GROUP_EDGE_BIND:-0.0.0.0}:${RELAY_GROUP_EDGE_HOST_PORT:-1443}:443"
      # ★ 控制面 WSS（只跑主机隧道）：nginx 前置时 BIND 改 127.0.0.1，由 nginx 8443 转发
      - "${RELAY_GROUP_CONTROL_BIND:-0.0.0.0}:${RELAY_GROUP_CONTROL_HOST_PORT:-18443}:8443"
      # ★ 注册 API（主机自助开通；主机插件「服务地址」填它）。
      #   nginx 反代时把 RELAY_GROUP_API_HOST_BIND 改成 127.0.0.1（只在 nginx 后面可达）。
      - "${RELAY_GROUP_API_HOST_BIND:-0.0.0.0}:${RELAY_GROUP_API_HOST_PORT:-19443}:9443"
      # 仅本机：部署方后台（SSH 隧道 / nginx admin vhost 访问，绝不放公网）
      - "127.0.0.1:${RELAY_GROUP_ADMIN_HOST_PORT:-19444}:9444"
      # 仅本机：/healthz（不承载业务）；同机 classic 默认也占 18080，冲突时改 RELAY_GROUP_HEALTH_HOST_PORT
      - "127.0.0.1:${RELAY_GROUP_HEALTH_HOST_PORT:-18080}:80"
    environment:
      RELAY_MODE: group
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      # 域名/证书：首次启动据此自动生成 data/config/relay.json
      # 未设置时 compose 直接报错（避免容器起来后才报「RELAY_DOMAIN 为空」）
      RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN 未设置：请在 .env/.env.group 里配置，并用 --env-file .env.group（或把文件命名为 .env）}
      RELAY_TLS_CERT_FILE: ${RELAY_TLS_CERT_FILE:-}
      RELAY_TLS_KEY_FILE: ${RELAY_TLS_KEY_FILE:-}
      RELAY_GROUP_EDGE_CERT_FILE: ${RELAY_GROUP_EDGE_CERT_FILE:-}
      RELAY_GROUP_EDGE_KEY_FILE: ${RELAY_GROUP_EDGE_KEY_FILE:-}
      RELAY_GROUP_FILE: ${RELAY_GROUP_FILE:-/data/group.json}
      # 可选：显式指定 admin token（否则首次启动自动生成到 /data/admin-token）
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-}
      # 手机实际访问的公网端口（写进配对二维码）：
      #   nginx 前置 = nginx listen（通常 443）；直连 = RELAY_GROUP_EDGE_HOST_PORT
      RELAY_GROUP_MOBILE_PORT: ${RELAY_GROUP_MOBILE_PORT:-443}
      # 注册响应下发给主机的控制面 WSS 公网端口：
      # 必须 = 主机实际连接的公网端口（nginx 实际 listen 端口，或直连时的宿主映射端口）。
      # 默认 8443 只是示例；relay 不会自动探测 nginx/端口映射，填错会导致 control socket error。
      RELAY_GROUP_PUBLIC_CONTROL_PORT: ${RELAY_GROUP_PUBLIC_CONTROL_PORT:-8443}
      # 容器内固定端口（职责分离；宿主映射见上面 ports，不要在这里改）
      RELAY_GROUP_API_PORT: "9443"
      RELAY_GROUP_API_BIND: "0.0.0.0"
      RELAY_GROUP_ADMIN_PORT: "9444"
      RELAY_GROUP_ADMIN_BIND: "0.0.0.0"   # host publish 已限制 127.0.0.1
    volumes:
      - ./data:/data
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
