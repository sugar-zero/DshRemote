# ============================================================================
# 模板 B：纯源码构建 relay 镜像并启动
#
# 构建 + 启动：
#   cp .env.example .env
#   # 编辑 .env（RELAY_DOMAIN / 端口 / DSH_RELAY_IMAGE）
#   docker compose -f docker-compose.build.yml up -d --build
#
# 只构建不启动：
#   docker compose -f docker-compose.build.yml build
#
# 本机为 Apple Silicon、服务器为 x86_64 时，先设置平台：
#   DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose -f docker-compose.build.yml up -d --build
#
# 构建后可导出离线镜像：
#   docker save -o dsh-relay-0.1.0-linux-amd64.tar dsh-remote-relay:0.1.0
# ============================================================================

name: dsh-remote-server

services:
  relay:
    build:
      context: ../dsh-remoteService
      dockerfile: packages/relay/Dockerfile
    image: ${DSH_RELAY_IMAGE:-dsh-remote-relay:0.1.0}
    container_name: dsh-relay
    # 镜像 ENTRYPOINT 会先根据 RELAY_HOST_ID/TOKEN 补齐 /data/tokens.json，
    # 再执行这个 CMD；纯环境变量模式，不需要 relay.json。
    command: ["node", "packages/relay/bin/relay.js"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_DATA_PORT_HOST:-1443}:443"
      - "127.0.0.1:${RELAY_CONTROL_PORT_HOST:-18443}:8443"
      - "127.0.0.1:${RELAY_HTTP_PORT_HOST:-18080}:80"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?请在 .env 中设置 RELAY_DOMAIN}
      RELAY_HOST_ID: ${RELAY_HOST_ID:?请在 .env 中设置 RELAY_HOST_ID}
      RELAY_HOST_TOKEN: ${RELAY_HOST_TOKEN:-}
      RELAY_DATA_PORT: "443"
      RELAY_CONTROL_PORT: "8443"
      RELAY_HTTP_PORT: "80"
      RELAY_DATA_HOST: "0.0.0.0"
      RELAY_TOKENS_FILE: /data/tokens.json
      RELAY_TLS_CERT_FILE: /data/certs/${RELAY_DOMAIN}/fullchain.pem
      RELAY_TLS_KEY_FILE: /data/certs/${RELAY_DOMAIN}/privkey.pem
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
    volumes:
      - ./data:/data
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
