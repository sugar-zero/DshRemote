# DSH Remote 生产服务器编排：自托管盲中继（relay）
#
# 默认只启动 relay（适合服务器上已有 nginx 的情况）：
#   docker compose up -d relay
# relay 只绑定 127.0.0.1 的回环端口，由宿主机 nginx 做 443/8443 的 TCP 透传。
#
# 如果这是一台专用服务器、想让 compose 连 nginx 一起起：
#   docker compose --profile standalone up -d
# nginx 容器会占用 80/443/8443；此时不要再在本机起第二个 nginx。
#
# 证书/数据目录（不提交到 git）：
#   data/config/relay.json             可选；本文件用环境变量代替
#   data/certs/<relay-domain>/fullchain.pem   relay 控制面证书
#   data/certs/<relay-domain>/privkey.pem
#   data/tokens.json                   token create 后生成
#
# 详细步骤见 server/README.md。

name: dsh-remote-server

services:
  relay:
    build:
      # 复用 dsh-remoteService 的 relay Dockerfile
      context: ../dsh-remoteService
      dockerfile: packages/relay/Dockerfile
    image: ${DSH_RELAY_IMAGE:-dsh-remote-relay:0.1.0}
    container_name: dsh-relay
    restart: unless-stopped
    ports:
      # 只给宿主机 nginx 用；不要直接暴露公网
      - "127.0.0.1:${RELAY_DATA_PORT_HOST:-1443}:443"
      - "127.0.0.1:${RELAY_CONTROL_PORT_HOST:-18443}:8443"
      - "127.0.0.1:${RELAY_HTTP_PORT_HOST:-18080}:80"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?请在 .env 中设置 RELAY_DOMAIN}
      RELAY_DATA_PORT: "443"
      RELAY_CONTROL_PORT: "8443"
      RELAY_HTTP_PORT: "80"
      RELAY_DATA_HOST: "0.0.0.0"
      RELAY_TOKENS_FILE: /data/tokens.json
      RELAY_TLS_CERT_FILE: /data/certs/${RELAY_DOMAIN}/fullchain.pem
      RELAY_TLS_KEY_FILE: /data/certs/${RELAY_DOMAIN}/privkey.pem
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
    volumes:
      - ./data:/data
    sysctls:
      # 非 root 用户绑定容器内 80/443
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：专用服务器自带 nginx。已有宿主机 nginx 时不要启用这个 profile。
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    profiles: ["standalone"]
    container_name: dsh-nginx
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/container-nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
