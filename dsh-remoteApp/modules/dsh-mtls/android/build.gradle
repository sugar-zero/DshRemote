// dsh-mtls/android/build.gradle
//
// Local Expo module (auto-linked by Expo Autolinking from `modules/`).
// 群体服务版：P-256 设备密钥（AndroidKeyStore）+ challenge 签名 + 会话 cookie。
// 需要 `npx expo run:android` 构建原生包（Expo Go 不包含该模块）。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.dsh.remote.mtls'
version = '0.2.0'

android {
  namespace 'com.dsh.remote.mtls'
  defaultConfig {
    versionCode 18
    versionName '0.2.0'
  }
}
