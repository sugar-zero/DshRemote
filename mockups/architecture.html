<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH 远程访问 - 架构图</title>
<style>
  html,body{margin:0;padding:0;background:#f6f7f9;}
  svg{display:block;}
  text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
</style>
</head>
<body>
<svg width="1600" height="1020" viewBox="0 0 1600 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="1020" fill="#f6f7f9"/>
  <text x="48" y="64" font-size="34" font-weight="700" fill="#111827">DSH 远程访问 · 推荐架构（方案 B）</text>
  <text x="48" y="98" font-size="17" fill="#6b7280">盲中继 + TLS 透传 + 设备 mTLS + WebView 复用现有 UI ｜ B2 下 relay 零明文、DSH 本机服务保持 127.0.0.1</text>

  <!-- 图例 -->
  <g font-size="13" fill="#475569">
    <line x1="1090" y1="52" x2="1130" y2="52" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="1138" y="57">数据（TLS + mTLS）</text>
    <line x1="1090" y1="80" x2="1130" y2="80" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1138" y="85">主机主动外联 WSS</text>
    <line x1="1090" y1="108" x2="1130" y2="108" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
    <text x="1138" y="113">控制面 WSS（仅主机）</text>
  </g>

  <!-- ============ 手机 App ============ -->
  <rect x="48" y="140" width="340" height="590" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="1.5"/>
  <rect x="48" y="140" width="340" height="56" rx="18" fill="#eef2ff"/>
  <rect x="48" y="172" width="340" height="24" fill="#eef2ff"/>
  <g transform="translate(70,155)">
    <rect width="24" height="24" rx="7" fill="#4f46e5"/>
    <rect x="7" y="4" width="10" height="15" rx="2.5" fill="#ffffff"/>
    <circle cx="12" cy="21" r="1" fill="#c7d2fe"/>
  </g>
  <text x="104" y="177" font-size="22" font-weight="700" fill="#1e3a8a">手机 App（Expo / RN）</text>

  <rect x="72" y="220" width="292" height="118" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="250" font-size="17" font-weight="600" fill="#0f172a">WebView：现有 DSH Web UI</text>
  <text x="88" y="278" font-size="14" fill="#475569">会话 / 终端 / 审批 / diff / 文件</text>
  <text x="88" y="302" font-size="14" fill="#475569">+ 注入移动端皮肤（侧栏变抽屉）</text>
  <text x="88" y="326" font-size="13" fill="#94a3b8">UI 随主机升级，App 不必重发版</text>

  <rect x="72" y="352" width="292" height="96" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="88" y="382" font-size="17" font-weight="600" fill="#78350f">设备身份（硬件密钥）</text>
  <text x="88" y="408" font-size="14" fill="#92400e">私钥在 Secure Enclave / Keystore</text>
  <text x="88" y="432" font-size="14" fill="#92400e">不可导出 → 用于 TLS 客户端证书</text>

  <rect x="72" y="462" width="292" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="492" font-size="17" font-weight="600" fill="#0f172a">扫码配对</text>
  <text x="88" y="518" font-size="14" fill="#475569">一次性密钥 + 主机指纹 + SAS 对照</text>
  <text x="88" y="542" font-size="14" fill="#475569">证书存入 Keychain / Keystore</text>

  <rect x="72" y="572" width="292" height="132" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="602" font-size="17" font-weight="600" fill="#0f172a">原生能力</text>
  <text x="88" y="628" font-size="14" fill="#475569">推送（通用文案·不含内容） / Face ID 门禁</text>
  <text x="88" y="652" font-size="14" fill="#475569">设备管理 / 诊断 / 自动重连</text>
  <text x="88" y="676" font-size="13" fill="#94a3b8">WebView 负责功能，原生负责信任</text>

  <!-- ============ relay ============ -->
  <rect x="516" y="120" width="500" height="630" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="1.5"/>
  <rect x="516" y="120" width="500" height="56" rx="18" fill="#ecfdf5"/>
  <rect x="516" y="152" width="500" height="24" fill="#ecfdf5"/>
  <g transform="translate(538,135)">
    <rect width="24" height="24" rx="7" fill="#10b981"/>
    <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">⇄</text>
  </g>
  <text x="572" y="157" font-size="22" font-weight="700" fill="#065f46">自托管 relay（盲中继）</text>
  <text x="992" y="157" text-anchor="end" font-size="13" fill="#047857">Docker 单容器 · 1 个域名</text>

  <rect x="540" y="200" width="452" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="230" font-size="17" font-weight="600" fill="#064e3b">443/tcp · TLS 透传（按 SNI 路由）</text>
  <text x="556" y="256" font-size="14" fill="#166534">只转发加密字节，不终止、不看内容</text>
  <text x="556" y="278" font-size="13" fill="#4d7c0f">&lt;hostid&gt;.relay.example.com → 对应主机</text>

  <rect x="540" y="306" width="452" height="86" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="336" font-size="17" font-weight="600" fill="#064e3b">80/tcp · HTTPS 跳转</text>
  <text x="556" y="362" font-size="14" fill="#166534">B2 证书走主机侧 DNS-01，不经过 relay</text>
  <text x="556" y="384" font-size="13" fill="#4d7c0f">B1 由 relay 代签并下发（接受其冒充风险）</text>

  <rect x="540" y="410" width="452" height="86" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="440" font-size="17" font-weight="600" fill="#064e3b">8443/tcp · 控制面</text>
  <text x="556" y="466" font-size="14" fill="#166534">主机注册 / 心跳 presence / 推送注册</text>
  <text x="556" y="488" font-size="13" fill="#4d7c0f">WSS + TLS，仅元数据</text>

  <rect x="540" y="514" width="452" height="86" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="544" font-size="17" font-weight="600" fill="#064e3b">推送网关</text>
  <text x="556" y="570" font-size="14" fill="#166534">APNs / FCM / Expo Push（可见文案·不含内容）</text>
  <text x="556" y="592" font-size="13" fill="#4d7c0f">只发「需要关注」+ 不透明 id</text>

  <rect x="540" y="618" width="452" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="556" y="648" font-size="17" font-weight="600" fill="#9a3412">存储：SQLite（最小元数据）</text>
  <text x="556" y="674" font-size="14" fill="#9a3412">host 注册 / 在线时间 / 推送 token / 字节计数</text>
  <text x="556" y="696" font-size="13" fill="#b45309">✗ 不存会话、文件、标题、cookie、token</text>
  <text x="556" y="736" font-size="14" fill="#6b7280">能力边界：能看到「哪个 host 在线、流量大小」；看不到设备身份与内容</text>

  <!-- ============ 主机 ============ -->
  <rect x="1116" y="140" width="436" height="590" rx="18" fill="#ffffff" stroke="#d7dce4" stroke-width="1.5"/>
  <rect x="1116" y="140" width="436" height="56" rx="18" fill="#fef2f2"/>
  <rect x="1116" y="172" width="436" height="24" fill="#fef2f2"/>
  <g transform="translate(1138,155)">
    <rect width="24" height="24" rx="7" fill="#ef4444"/>
    <rect x="4" y="5" width="16" height="10" rx="2" fill="#ffffff"/>
    <rect x="10" y="17" width="4" height="3" fill="#ffffff"/>
    <rect x="7" y="20" width="10" height="2" rx="1" fill="#ffffff"/>
  </g>
  <text x="1172" y="177" font-size="22" font-weight="700" fill="#7f1d1d">Mac / DSH 主机（插件）</text>

  <rect x="1140" y="216" width="388" height="104" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1156" y="246" font-size="17" font-weight="600" fill="#881337">TLS 终止 + mTLS 验设备</text>
  <text x="1156" y="272" font-size="14" fill="#9f1239">LE 证书：B2 主机 DNS-01 / B1 relay 代签</text>
  <text x="1156" y="296" font-size="14" fill="#9f1239">设备 CA 校验：拒绝无证书/过期/已撤销</text>

  <rect x="1140" y="334" width="388" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1156" y="364" font-size="17" font-weight="600" fill="#0f172a">HTTP / WS 反向代理</text>
  <text x="1156" y="390" font-size="14" fill="#475569">剥离客户端 Host/Cookie/Forwarded 头</text>
  <text x="1156" y="414" font-size="14" fill="#475569">固定 Host=127.0.0.1，注入本机 owner cookie</text>

  <rect x="1140" y="452" width="388" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1156" y="482" font-size="17" font-weight="600" fill="#0f172a">设备 / 安全 / 审计</text>
  <text x="1156" y="508" font-size="14" fill="#475569">设备注册表、配对状态机、撤销、audit.jsonl</text>
  <text x="1156" y="532" font-size="13" fill="#94a3b8">$DSH_HOME/remote-access/ 0600</text>

  <rect x="1140" y="562" width="388" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1156" y="592" font-size="17" font-weight="600" fill="#0f172a">中继连接器</text>
  <text x="1156" y="618" font-size="14" fill="#475569">主动外联 WSS（无入站端口）· 断线重连</text>

  <rect x="1140" y="662" width="388" height="52" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1156" y="686" font-size="15" font-weight="600" fill="#1e3a8a">DSH Web Server · 127.0.0.1:3080（不变）</text>
  <text x="1156" y="704" font-size="12" fill="#4338ca">仍是 loopback-only；不加 --trusted-host、不 bind 公网</text>

  <!-- ============ arrows ============ -->
  <!-- App <-> relay : TLS 443 -->
  <line x1="388" y1="300" x2="516" y2="300" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="516" y1="324" x2="388" y2="324" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="452" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">HTTPS / WSS</text>
  <text x="452" y="272" text-anchor="middle" font-size="14" fill="#2563eb">443（TLS 透传）</text>
  <text x="452" y="292" text-anchor="middle" font-size="13" fill="#3b82f6">TLS 1.3 + 设备 mTLS</text>
  <text x="452" y="352" text-anchor="middle" font-size="12" fill="#64748b">端到端到主机插件</text>

  <!-- App 只连 443 -->
  <text x="452" y="452" text-anchor="middle" font-size="12" fill="#94a3b8">App 只需知道一个主机地址</text>
  <text x="452" y="470" text-anchor="middle" font-size="12" fill="#94a3b8">配对 / 数据都走 443</text>

  <!-- relay <-> host : WSS data/control -->
  <line x1="1016" y1="300" x2="1116" y2="300" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1116" y1="324" x2="1016" y2="324" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1066" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">WSS 数据面</text>
  <text x="1066" y="272" text-anchor="middle" font-size="13" fill="#475569">加密字节原样转发</text>
  <text x="1066" y="292" text-anchor="middle" font-size="12" fill="#64748b">主机主动外联</text>
  <text x="1066" y="352" text-anchor="middle" font-size="12" fill="#64748b">relay 无法解密</text>

  <!-- host -> relay : control 8443 -->
  <line x1="1116" y1="470" x2="1016" y2="470" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
  <text x="1066" y="446" text-anchor="middle" font-size="12.5" fill="#047857">控制面 8443</text>
  <text x="1066" y="490" text-anchor="middle" font-size="12" fill="#059669">仅主机注册/心跳</text>

  <!-- host internal: plugin -> DSH -->
  <line x1="1334" y1="638" x2="1334" y2="662" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1348" y="655" font-size="12" fill="#1e3a8a">loopback</text>

  <!-- DNS -->
  <rect x="48" y="916" width="340" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="948" font-size="14" fill="#475569">DNS：*.relay.example.com → relay 公网 IP</text>

  <!-- push -->
  <rect x="1116" y="760" width="436" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1136" y="792" font-size="14" fill="#166534">推送：relay → APNs / FCM / Expo ｜ 通用可见文案、不含内容</text>

  <!-- trust boundary -->
  <rect x="516" y="792" width="500" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="540" y="822" font-size="15" font-weight="700" fill="#111827">信任边界（为什么伪造头无效）</text>
  <text x="540" y="858" font-size="13.5" fill="#334155">① 身份 = 设备客户端证书（TLS 层），不是 Host / XFF / 来源 IP</text>
  <text x="540" y="882" font-size="13.5" fill="#334155">② relay 只转发加密字节，拿不到 DSH cookie / token</text>
  <text x="540" y="906" font-size="13.5" fill="#334155">③ 主机插件只对「证书校验通过」的连接做反代，并重写全部头</text>
  <text x="540" y="930" font-size="13.5" fill="#334155">④ DSH Web 服务仍是 loopback-only，信任模型不变</text>
  <text x="540" y="948" font-size="12.5" fill="#b45309">⑤ 恶意 relay：B1 可冒充服务器但拿不到设备私钥、无法操作主机；B2/B′ 可消除</text>

  <text x="218" y="772" text-anchor="middle" font-size="12" fill="#94a3b8">渲染现有 DSH 前端 · 功能零重写</text>
</svg>
</body>
</html>
